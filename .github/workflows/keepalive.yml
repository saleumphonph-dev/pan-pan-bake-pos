name: Supabase Keep-Alive

# Free-tier Supabase projects auto-pause after ~7 days of inactivity, which
# silently breaks cross-device sync (the hostname stops resolving). This pings
# the database on a schedule so the project never goes idle.

on:
  schedule:
    # Runs EVERY DAY (02:17 UTC). Twice a week was too close to the ~7-day
    # auto-pause window — a single skipped GitHub-cron run could let it pause.
    # Daily leaves a large safety margin.
    - cron: "17 2 * * *"
  workflow_dispatch: {} # allow manual "Run workflow" from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # Retry before crying wolf. A single 503 is usually a momentary blip on
          # the shared free-tier pooler, not a paused project — two such blips
          # raised failures on 27 and 28 Aug while the database was serving the
          # shop normally either side of them. Only a run where every attempt
          # fails is worth an alert.
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              "$SUPABASE_URL/rest/v1/sales?select=id&limit=1" \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY")
            if [ "$code" = "200" ] || [ "$code" = "206" ]; then
              echo "✅ Keep-alive OK on attempt $attempt (HTTP $code) — project is active."
              exit 0
            fi
            echo "attempt $attempt: HTTP $code"
            [ "$attempt" -lt 5 ] && sleep 30
          done
          echo "❌ Keep-alive failed 5 times over ~2 minutes (last HTTP $code)."
          echo "   The project may genuinely be paused or down — check the Supabase dashboard."
          exit 1
